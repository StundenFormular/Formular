<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachrichten – Admin</title>
<style>
  :root{ --purple:#3D3A87; --gold:#E8A33D; --border:#e2e2ea; --bg:#f5f5fa; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:#1a1a2e; }
  header{ background:var(--purple); color:#fff; padding:16px 20px; font-weight:800; font-size:18px; }

  .pinBack{ position:fixed; inset:0; z-index:50; background:linear-gradient(160deg, #201c46, #3D3A87); display:flex; align-items:center; justify-content:center; padding:20px; }
  .pinCard{ background:rgba(20,18,50,.55); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:28px 22px; max-width:360px; width:100%; text-align:center; }
  .pinCard h1{ color:#fff; font-size:20px; margin:0 0 6px; }
  .pinCard p{ color:rgba(255,255,255,.7); font-size:13px; margin:0 0 18px; }
  .pinCard input{ width:100%; padding:14px 16px; border-radius:16px; border:none; font-size:18px; text-align:center; margin-bottom:12px; }
  .pinCard button{ width:100%; padding:13px; border-radius:16px; border:none; background:linear-gradient(135deg, var(--purple), #6b63c9); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  .pinErr{ display:none; color:#ff9a9a; font-size:13px; margin-top:10px; }

  #app{ display:none; padding:16px; max-width:900px; margin:0 auto; }

  .threadCard{ background:#fff; border-radius:14px; border:1px solid var(--border); margin-bottom:14px; overflow:hidden; }
  .threadHeader{ padding:12px 14px; background:#faf9ff; font-weight:800; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .threadBody{ padding:14px; display:none; }
  .msgBubble{ padding:8px 10px; border-radius:10px; margin-bottom:8px; font-size:13px; max-width:80%; }
  .msgMitarbeiter{ background:#f0f0f5; margin-right:auto; }
  .msgAdmin{ background:rgba(232,163,61,.25); margin-left:auto; }
  .replyRow{ display:flex; gap:8px; margin-top:10px; }
  .replyRow textarea{ flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--border); font-size:13px; min-height:44px; }
  .replyRow button{ padding:0 16px; border-radius:10px; border:none; background:var(--purple); color:#fff; font-weight:700; cursor:pointer; }
  #refreshBtn{ margin-bottom:14px; padding:10px 16px; border-radius:10px; border:none; background:var(--purple); color:#fff; font-weight:700; cursor:pointer; }
  #emptyState{ color:#777; padding:20px; text-align:center; }

  .tabBar{ display:flex; gap:8px; margin-bottom:16px; }
  .tabBtn{ padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:#fff; color:#1a1a2e; font-weight:700; cursor:pointer; }
  .tabBtn.active{ background:var(--purple); color:#fff; border-color:var(--purple); }
  .tabPanel{ display:none; }
  .tabPanel.active{ display:block; }

  .uploadCard{ background:#fff; border-radius:14px; border:1px solid var(--border); padding:18px; }
  .uploadCard input[type="text"]{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-bottom:10px; box-sizing:border-box; }
  .searchResults{ margin-bottom:12px; }
  .searchResultItem{ padding:10px 12px; border-radius:10px; border:1px solid var(--border); margin-bottom:6px; cursor:pointer; font-size:14px; }
  .searchResultItem:hover{ background:#faf9ff; }
  .searchResultItem.selected{ background:var(--purple); color:#fff; border-color:var(--purple); }
  .selectedEmployee{ padding:10px 12px; border-radius:10px; background:rgba(232,163,61,.15); border:1px solid var(--gold); margin-bottom:12px; font-weight:700; }
  #uploadFileInput{ margin-bottom:12px; }
  #uploadBtn{ width:100%; padding:12px; border-radius:10px; border:none; background:linear-gradient(135deg, var(--purple), #6b63c9); color:#fff; font-weight:800; cursor:pointer; }
  #uploadStatus{ margin-top:10px; font-size:13px; }

  .overviewBar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .overviewBar input[type="month"]{ padding:10px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; }
  .overviewBar button{ padding:10px 16px; border-radius:10px; border:none; background:var(--purple); color:#fff; font-weight:700; cursor:pointer; }

  .empCard{ background:#fff; border-radius:14px; border:1px solid var(--border); margin-bottom:10px; overflow:hidden; }
  .empHeader{ padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .empHeader.sent{ border-left:5px solid #2f9e44; }
  .empHeader.notSent{ border-left:5px solid #c0392b; }
  .empStatusDot{ font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; }
  .empStatusDot.sent{ background:rgba(47,158,68,.15); color:#2f9e44; }
  .empStatusDot.notSent{ background:rgba(192,57,43,.15); color:#c0392b; }
  .empBody{ display:none; padding:14px; border-top:1px solid var(--border); }
  .empSums{ display:flex; gap:16px; margin-bottom:12px; flex-wrap:wrap; }
  .empSumBox{ background:#faf9ff; border-radius:10px; padding:8px 14px; font-size:13px; }
  .empSumBox b{ display:block; font-size:16px; }
  .freigabeToggle{ display:flex; align-items:center; gap:8px; margin-bottom:14px; font-weight:700; font-size:13px; }
  .dayRow{ display:grid; grid-template-columns:90px 1fr 70px 70px 70px 64px; gap:6px; align-items:center; padding:6px 4px; border-bottom:1px solid var(--border); font-size:12px; }
  .dayRow input{ width:100%; padding:5px 6px; border-radius:6px; border:1px solid var(--border); font-size:12px; box-sizing:border-box; }
  .dayRow.diverges{ background:rgba(255,213,74,.12); }
  .dayEditBtn{ border:none; background:var(--purple); color:#fff; border-radius:6px; padding:4px 6px; cursor:pointer; font-size:11px; }
  .dayComment{ grid-column:1 / -1; font-size:11px; color:#8A5A15; background:rgba(232,163,61,.12); padding:4px 8px; border-radius:6px; margin-top:2px; }
</style>
</head>
<body>

<div class="pinBack" id="pinBack">
  <div class="pinCard">
    <h1>Nachrichten-Übersicht</h1>
    <p>Admin-Zugang für Stunden-Korrekturen & Rückfragen</p>
    <input id="pinInput" inputmode="numeric" placeholder="Admin-PIN eingeben">
    <button id="pinBtn" type="button">Anmelden</button>
    <div class="pinErr" id="pinErr">Falscher PIN</div>
  </div>
</div>

<div id="app">
  <header style="margin:-16px -16px 16px -16px;">Admin-Bereich</header>

  <div class="tabBar">
    <button class="tabBtn active" id="tabNachrichtenBtn" type="button">💬 Nachrichten</button>
    <button class="tabBtn" id="tabUploadBtn" type="button">📎 Dokument hochladen</button>
    <button class="tabBtn" id="tabOverviewBtn" type="button">📊 Stundenübersicht</button>
  </div>

  <div class="tabPanel active" id="tabNachrichten">
    <button id="refreshBtn" type="button">🔄 Aktualisieren</button>
    <div id="threadsWrap"></div>
    <div id="emptyState" style="display:none;">Noch keine Nachrichten.</div>
  </div>

  <div class="tabPanel" id="tabUpload">
    <div class="uploadCard">
      <div style="font-weight:800; margin-bottom:10px;">Mitarbeiter suchen</div>
      <input type="text" id="searchNameInput" placeholder="Name eingeben (Tippfehler werden toleriert)...">
      <div class="searchResults" id="searchResults"></div>

      <div id="selectedEmployeeWrap" style="display:none;">
        <div class="selectedEmployee" id="selectedEmployeeLabel"></div>

        <input type="file" id="uploadFileInput" accept="application/pdf">
        <button id="uploadBtn" type="button">Dokument hochladen</button>
        <div id="uploadStatus"></div>

        <hr style="margin:18px 0; border:none; border-top:1px solid var(--border);">

        <div style="font-weight:800; margin-bottom:8px;">Vermerke (z.B. Verspätungen)</div>
        <div id="vermerkeListWrap" style="margin-bottom:10px;"></div>
        <textarea id="vermerkTextInput" placeholder="z.B. Verspätung am 05.12. um 10 Minuten" style="width:100%; min-height:110px; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; font-family:monospace; white-space:pre; margin-bottom:10px; box-sizing:border-box; resize:vertical;"></textarea>
        <button id="vermerkAddBtn" type="button" style="width:100%; padding:12px; border-radius:10px; border:none; background:linear-gradient(135deg, var(--purple), #6b63c9); color:#fff; font-weight:800; cursor:pointer;">Eintrag hinzufügen</button>
        <div id="vermerkStatus" style="margin-top:10px; font-size:13px;"></div>
      </div>
    </div>
  </div>

  <div class="tabPanel" id="tabOverview">
    <div class="overviewBar">
      <input type="month" id="overviewMonthInput">
      <button id="overviewLoadBtn" type="button">Anzeigen</button>
    </div>
    <div id="overviewWrap"></div>
  </div>
</div>

<script>
const EQUIP_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNrtg6-hoAv_kWkuE_noqRtlRYYJAzQMxJnpnEbyP3b4JjlHyG4vPVsuqdC45xrPe9/exec";
const EQUIP_API_TOKEN   = "Zk0sUhvBN2XU13DGgeAwhm-H-rtmBcK1OwJR7NLc1VI";
const ADMIN_PIN = "19630";

const pinBack = document.getElementById("pinBack");
const pinInput = document.getElementById("pinInput");
const pinBtn = document.getElementById("pinBtn");
const pinErr = document.getElementById("pinErr");
const appEl = document.getElementById("app");
const threadsWrap = document.getElementById("threadsWrap");
const emptyState = document.getElementById("emptyState");
const refreshBtn = document.getElementById("refreshBtn");

function checkPin(){
  if(pinInput.value.trim() === ADMIN_PIN){
    pinBack.style.display = "none";
    appEl.style.display = "block";
    loadThreads();
  }else{
    pinErr.style.display = "block";
  }
}
pinBtn.addEventListener("click", checkPin);
pinInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") checkPin(); });
refreshBtn.addEventListener("click", loadThreads);

// ===== Tabs =====
const tabNachrichtenBtn = document.getElementById("tabNachrichtenBtn");
const tabUploadBtn = document.getElementById("tabUploadBtn");
const tabOverviewBtn = document.getElementById("tabOverviewBtn");
const tabNachrichten = document.getElementById("tabNachrichten");
const tabUpload = document.getElementById("tabUpload");
const tabOverview = document.getElementById("tabOverview");

function activateTab(btn, panel){
  [tabNachrichtenBtn, tabUploadBtn, tabOverviewBtn].forEach(b => b.classList.remove("active"));
  [tabNachrichten, tabUpload, tabOverview].forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  panel.classList.add("active");
}

tabNachrichtenBtn.addEventListener("click", ()=> activateTab(tabNachrichtenBtn, tabNachrichten));
tabUploadBtn.addEventListener("click", ()=> activateTab(tabUploadBtn, tabUpload));
tabOverviewBtn.addEventListener("click", ()=>{
  activateTab(tabOverviewBtn, tabOverview);
  if(!overviewMonthInput.value){
    const now = new Date();
    overviewMonthInput.value = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  }
  loadOverview();
});

// ===== Mitarbeiter-Suche (tippfehler-tolerant) =====
const searchNameInput = document.getElementById("searchNameInput");
const searchResults = document.getElementById("searchResults");
const selectedEmployeeWrap = document.getElementById("selectedEmployeeWrap");
const selectedEmployeeLabel = document.getElementById("selectedEmployeeLabel");
const uploadFileInput = document.getElementById("uploadFileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");

let selectedPin = null;
let searchDebounce = null;

searchNameInput.addEventListener("input", ()=>{
  clearTimeout(searchDebounce);
  const query = searchNameInput.value.trim();
  if(query.length < 2){
    searchResults.innerHTML = "";
    return;
  }
  searchDebounce = setTimeout(()=> runSearch(query), 300);
});

async function runSearch(query){
  searchResults.innerHTML = `<div style="color:#777; font-size:13px;">Suche...</div>`;
  try{
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "searchEmployee", query: query })
    });
    const data = await res.json();
    if(data.status !== "success" || !data.results || data.results.length === 0){
      searchResults.innerHTML = `<div style="color:#777; font-size:13px;">Keine Treffer.</div>`;
      return;
    }
    searchResults.innerHTML = "";
    data.results.forEach(r=>{
      const item = document.createElement("div");
      item.className = "searchResultItem";
      item.textContent = `${r.name} (PIN ${r.pin})`;
      item.addEventListener("click", ()=>{
        selectedPin = r.pin;
        selectedEmployeeLabel.textContent = `Ausgewählt: ${r.name} (PIN ${r.pin})`;
        selectedEmployeeWrap.style.display = "block";
        searchResults.innerHTML = "";
        searchNameInput.value = "";
        uploadStatus.textContent = "";
        loadVermerkeList();
      });
      searchResults.appendChild(item);
    });
  }catch(err){
    searchResults.innerHTML = `<div style="color:#c0392b; font-size:13px;">Fehler: ${err.message}</div>`;
  }
}

uploadBtn.addEventListener("click", async ()=>{
  if(!selectedPin){
    uploadStatus.style.color = "#c0392b";
    uploadStatus.textContent = "Bitte zuerst einen Mitarbeiter auswählen.";
    return;
  }
  const file = uploadFileInput.files[0];
  if(!file){
    uploadStatus.style.color = "#c0392b";
    uploadStatus.textContent = "Bitte eine Datei auswählen.";
    return;
  }

  uploadBtn.disabled = true;
  uploadStatus.style.color = "#666";
  uploadStatus.textContent = "Wird hochgeladen...";

  try{
    const base64 = await fileToBase64(file);
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({
        token: EQUIP_API_TOKEN,
        action: "uploadDocument",
        pin: selectedPin,
        filename: file.name,
        mimeType: file.type || "application/pdf",
        fileBase64: base64
      })
    });
    const result = await res.json();
    if(result.status === "success"){
      uploadStatus.style.color = "#2f9e44";
      uploadStatus.textContent = "Hochgeladen! Der Mitarbeiter sieht es jetzt in der App.";
      uploadFileInput.value = "";
    }else{
      uploadStatus.style.color = "#c0392b";
      uploadStatus.textContent = "Fehler: " + result.message;
    }
  }catch(err){
    uploadStatus.style.color = "#c0392b";
    uploadStatus.textContent = "Fehler: " + err.message;
  }finally{
    uploadBtn.disabled = false;
  }
});

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== Vermerke =====
const vermerkeListWrap = document.getElementById("vermerkeListWrap");
const vermerkTextInput = document.getElementById("vermerkTextInput");
const vermerkAddBtn = document.getElementById("vermerkAddBtn");
const vermerkStatus = document.getElementById("vermerkStatus");

async function loadVermerkeList(){
  if(!selectedPin) return;
  vermerkeListWrap.innerHTML = `<div style="color:#777; font-size:13px;">Lädt...</div>`;
  try{
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminGetVermerke", pin: selectedPin })
    });
    const data = await res.json();
    if(data.status !== "success" || !data.vermerke || data.vermerke.length === 0){
      vermerkeListWrap.innerHTML = `<div style="color:#777; font-size:13px;">Noch keine Einträge.</div>`;
      return;
    }
    vermerkeListWrap.innerHTML = data.vermerke.map(v => `
      <div style="padding:8px 10px; border-radius:8px; background:#faf9ff; border:1px solid var(--border); margin-bottom:6px; font-size:13px;">
        <span style="color:#777; font-size:11px; display:block;">${escapeHtml(v.zeitstempel)}</span>
        <div style="white-space:pre-wrap; font-family:monospace;">${escapeHtml(v.text)}</div>
      </div>
    `).join("");
  }catch(err){
    vermerkeListWrap.innerHTML = `<div style="color:#c0392b; font-size:13px;">Fehler: ${err.message}</div>`;
  }
}

vermerkAddBtn.addEventListener("click", async ()=>{
  const text = vermerkTextInput.value.trim();
  if(!selectedPin){
    vermerkStatus.style.color = "#c0392b";
    vermerkStatus.textContent = "Bitte zuerst einen Mitarbeiter auswählen.";
    return;
  }
  if(!text){
    vermerkStatus.style.color = "#c0392b";
    vermerkStatus.textContent = "Bitte einen Text eingeben.";
    return;
  }

  vermerkAddBtn.disabled = true;
  vermerkStatus.style.color = "#666";
  vermerkStatus.textContent = "Wird gespeichert...";

  try{
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "addVermerk", pin: selectedPin, text: text })
    });
    const result = await res.json();
    if(result.status === "success"){
      vermerkTextInput.value = "";
      vermerkStatus.textContent = "";
      loadVermerkeList();
    }else{
      vermerkStatus.style.color = "#c0392b";
      vermerkStatus.textContent = "Fehler: " + result.message;
    }
  }catch(err){
    vermerkStatus.style.color = "#c0392b";
    vermerkStatus.textContent = "Fehler: " + err.message;
  }finally{
    vermerkAddBtn.disabled = false;
  }
});

async function loadThreads(){
  threadsWrap.innerHTML = `<div style="text-align:center; padding:20px; color:#777;">Lädt...</div>`;
  emptyState.style.display = "none";

  try{
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminListMessages" })
    });
    const data = await res.json();

    if(data.status !== "success"){
      threadsWrap.innerHTML = `<div style="color:#c0392b; padding:20px;">Fehler: ${data.message}</div>`;
      return;
    }

    renderThreads(data.messages || []);
  }catch(err){
    threadsWrap.innerHTML = `<div style="color:#c0392b; padding:20px;">Fehler beim Laden: ${err.message}</div>`;
  }
}

function renderThreads(messages){
  const grouped = {};
  messages.forEach(m=>{
    if(!grouped[m.pin]) grouped[m.pin] = { name: m.name, pin: m.pin, msgs: [] };
    grouped[m.pin].msgs.push(m);
  });

  const pins = Object.keys(grouped);
  if(pins.length === 0){
    threadsWrap.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  threadsWrap.innerHTML = "";
  pins.forEach(pin=>{
    const thread = grouped[pin];
    const card = document.createElement("div");
    card.className = "threadCard";

    const lastMsg = thread.msgs[thread.msgs.length - 1];
    card.innerHTML = `
      <div class="threadHeader">
        <span>${escapeHtml(thread.name)} (PIN ${escapeHtml(pin)})</span>
        <span style="font-weight:400; font-size:12px; color:#777;">${thread.msgs.length} Nachricht${thread.msgs.length === 1 ? "" : "en"}</span>
      </div>
      <div class="threadBody">
        <div class="msgsInner"></div>
        <div class="replyRow">
          <textarea placeholder="Antwort schreiben..."></textarea>
          <button type="button">Senden</button>
        </div>
        <div class="replyStatus" style="font-size:12px; margin-top:6px;"></div>
        <button type="button" class="deleteChatBtn" style="margin-top:10px; width:100%; padding:8px; border-radius:8px; border:1px solid #c0392b; background:#fff; color:#c0392b; font-weight:700; cursor:pointer; font-size:12px;">🗑️ Gesamten Verlauf löschen</button>
      </div>
    `;

    const header = card.querySelector(".threadHeader");
    const body = card.querySelector(".threadBody");
    header.addEventListener("click", ()=>{
      body.style.display = body.style.display === "none" ? "block" : "none";
    });

    const msgsInner = card.querySelector(".msgsInner");
    thread.msgs.forEach(m=>{
      const bubble = document.createElement("div");
      bubble.className = "msgBubble " + (m.absender === "Admin" ? "msgAdmin" : "msgMitarbeiter");
      bubble.textContent = m.text;
      msgsInner.appendChild(bubble);
    });

    const deleteChatBtn = card.querySelector(".deleteChatBtn");
    deleteChatBtn.addEventListener("click", async ()=>{
      if(!confirm(`Gesamten Nachrichtenverlauf von ${thread.name} (PIN ${pin}) wirklich unwiderruflich löschen?`)) return;

      deleteChatBtn.disabled = true;
      deleteChatBtn.textContent = "Wird gelöscht...";
      try{
        const res = await fetch(EQUIP_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminDeleteChatHistory", pin: pin })
        });
        const result = await res.json();
        if(result.status === "success"){
          loadThreads();
        }else{
          alert("Fehler: " + result.message);
          deleteChatBtn.disabled = false;
          deleteChatBtn.textContent = "🗑️ Gesamten Verlauf löschen";
        }
      }catch(err){
        alert("Fehler: " + err.message);
        deleteChatBtn.disabled = false;
        deleteChatBtn.textContent = "🗑️ Gesamten Verlauf löschen";
      }
    });

    const replyBtn = card.querySelector(".replyRow button");
    const replyTextarea = card.querySelector(".replyRow textarea");
    const replyStatus = card.querySelector(".replyStatus");

    replyBtn.addEventListener("click", async ()=>{
      const text = replyTextarea.value.trim();
      if(!text) return;
      replyBtn.disabled = true;
      replyStatus.textContent = "Wird gesendet...";
      replyStatus.style.color = "#666";

      try{
        const res = await fetch(EQUIP_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminReply", pin: pin, text: text })
        });
        const result = await res.json();
        if(result.status === "success"){
          replyTextarea.value = "";
          replyStatus.textContent = "";
          loadThreads();
        }else{
          replyStatus.style.color = "#c0392b";
          replyStatus.textContent = "Fehler: " + result.message;
        }
      }catch(err){
        replyStatus.style.color = "#c0392b";
        replyStatus.textContent = "Fehler: " + err.message;
      }finally{
        replyBtn.disabled = false;
      }
    });

    threadsWrap.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ===== Stundenübersicht =====
const overviewMonthInput = document.getElementById("overviewMonthInput");
const overviewLoadBtn = document.getElementById("overviewLoadBtn");
const overviewWrap = document.getElementById("overviewWrap");

overviewLoadBtn.addEventListener("click", loadOverview);

async function loadOverview(){
  const month = overviewMonthInput.value;
  if(!month){
    overviewWrap.innerHTML = `<div style="color:#c0392b;">Bitte einen Monat wählen.</div>`;
    return;
  }
  overviewWrap.innerHTML = `<div style="text-align:center; padding:20px; color:#777;">Lädt...</div>`;

  try{
    const res = await fetch(EQUIP_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminGetOverview", month: month })
    });
    const data = await res.json();
    if(data.status !== "success"){
      overviewWrap.innerHTML = `<div style="color:#c0392b;">Fehler: ${data.message}</div>`;
      return;
    }
    renderOverview(data.results, month);
  }catch(err){
    overviewWrap.innerHTML = `<div style="color:#c0392b;">Fehler: ${err.message}</div>`;
  }
}

let expandedPin = null;

function renderOverview(results, month){
  if(!results || results.length === 0){
    overviewWrap.innerHTML = `<div style="color:#777; padding:20px; text-align:center;">Keine Mitarbeiter registriert.</div>`;
    return;
  }

  const sent = results.filter(e => e.hasSubmitted);
  const notSent = results.filter(e => !e.hasSubmitted);

  overviewWrap.innerHTML = `
    <div style="font-weight:900; font-size:15px; margin:16px 0 8px; color:#2f9e44;">✅ Gesendet (${sent.length})</div>
    <div id="overviewSentWrap"></div>
    <div style="font-weight:900; font-size:15px; margin:20px 0 8px; color:#c0392b;">❌ Noch nicht gesendet (${notSent.length})</div>
    <div id="overviewNotSentWrap"></div>
  `;

  const sentWrap = document.getElementById("overviewSentWrap");
  const notSentWrap = document.getElementById("overviewNotSentWrap");

  if(sent.length === 0){
    sentWrap.innerHTML = `<div style="color:#777; padding:10px; font-size:13px;">Niemand.</div>`;
  }else{
    sent.forEach(emp => sentWrap.appendChild(buildEmployeeCard(emp, month)));
  }

  if(notSent.length === 0){
    notSentWrap.innerHTML = `<div style="color:#777; padding:10px; font-size:13px;">Alle haben gesendet.</div>`;
  }else{
    notSent.forEach(emp => notSentWrap.appendChild(buildEmployeeCard(emp, month)));
  }
}

function buildEmployeeCard(emp, month){
  const card = document.createElement("div");
  card.className = "empCard";

  const statusClass = emp.hasSubmitted ? "sent" : "notSent";
  const statusLabel = emp.hasSubmitted ? "🟢 Gesendet" : "🔴 Noch nicht gesendet";

  const header = document.createElement("div");
  header.className = "empHeader " + statusClass;
  header.innerHTML = `
    <span><b>${escapeHtml(emp.name)}</b> (PIN ${escapeHtml(emp.pin)})</span>
    <span class="empStatusDot ${statusClass}">${statusLabel}</span>
  `;
  card.appendChild(header);

  const body = document.createElement("div");
  body.className = "empBody";

  if(emp.hasSubmitted){
    body.innerHTML = `
      <div class="empSums">
        <div class="empSumBox">Offiziell<b>${emp.summeOffiziell ?? 0} Std.</b></div>
        <div class="empSumBox">Eingereicht<b>${emp.summeEingereicht ?? 0} Std.</b></div>
      </div>
      <label class="freigabeToggle">
        <input type="checkbox" class="freigabeCheckbox" ${emp.freigegeben ? "checked" : ""}>
        Für diesen Monat freigegeben
      </label>
      <button type="button" class="deleteBlockBtn" style="width:100%; margin-bottom:12px; padding:8px; border-radius:8px; border:1px solid #c0392b; background:#fff; color:#c0392b; font-weight:700; cursor:pointer; font-size:12px;">🗑️ Diesen Monat komplett löschen</button>
      <div class="dayList"></div>
    `;

    const freigabeCheckbox = body.querySelector(".freigabeCheckbox");
    freigabeCheckbox.addEventListener("change", async ()=>{
      freigabeCheckbox.disabled = true;
      try{
        await fetch(EQUIP_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminSetFreigabe", pin: emp.pin, monat: month, value: freigabeCheckbox.checked })
        });
      }catch(err){
        alert("Fehler: " + err.message);
        freigabeCheckbox.checked = !freigabeCheckbox.checked;
      }finally{
        freigabeCheckbox.disabled = false;
      }
    });

    const deleteBlockBtn = body.querySelector(".deleteBlockBtn");
    deleteBlockBtn.addEventListener("click", async ()=>{
      if(!confirm(`Den kompletten Monat ${month} von ${emp.name} (PIN ${emp.pin}) wirklich unwiderruflich löschen?`)) return;

      deleteBlockBtn.disabled = true;
      deleteBlockBtn.textContent = "Wird gelöscht...";
      try{
        const res = await fetch(EQUIP_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminDeleteBlock", pin: emp.pin, monat: month })
        });
        const result = await res.json();
        if(result.status === "success"){
          expandedPin = null;
          loadOverview();
        }else{
          alert("Fehler: " + result.message);
          deleteBlockBtn.disabled = false;
          deleteBlockBtn.textContent = "🗑️ Diesen Monat komplett löschen";
        }
      }catch(err){
        alert("Fehler: " + err.message);
        deleteBlockBtn.disabled = false;
        deleteBlockBtn.textContent = "🗑️ Diesen Monat komplett löschen";
      }
    });

    const dayList = body.querySelector(".dayList");
    emp.days.forEach(d => {
      const diverges = String(d.stunden) !== String(d.eingereicht);
      const row = document.createElement("div");
      row.className = "dayRow" + (diverges ? " diverges" : "");
      row.innerHTML = `
        <div>${escapeHtml(d.datum)}</div>
        <input type="text" class="editStandort" value="${escapeHtml(d.standort)}">
        <input type="text" class="editBeginn" value="${escapeHtml(d.beginn)}">
        <input type="text" class="editEnde" value="${escapeHtml(d.ende)}">
        <input type="text" class="editStunden" value="${escapeHtml(d.stunden)}">
        <div style="display:flex; gap:4px;">
          <button class="dayEditBtn" type="button" title="Speichern">💾</button>
          <button class="dayDeleteBtn" type="button" title="Eintrag löschen">🗑️</button>
        </div>
        ${d.kommentar ? `<div class="dayComment">📝 ${escapeHtml(d.kommentar)}</div>` : ""}
      `;

      const saveBtn = row.querySelector(".dayEditBtn");
      saveBtn.addEventListener("click", async ()=>{
        const newStunden = row.querySelector(".editStunden").value;
        const newStandort = row.querySelector(".editStandort").value;
        const newBeginn = row.querySelector(".editBeginn").value;
        const newEnde = row.querySelector(".editEnde").value;
        const kommentar = prompt("Kommentar zu dieser Korrektur (optional):", d.kommentar || "");
        if(kommentar === null) return;

        saveBtn.disabled = true;
        try{
          const res = await fetch(EQUIP_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
              token: EQUIP_API_TOKEN, action: "adminEditDay",
              pin: emp.pin, monat: month, day: d.day,
              standort: newStandort, beginn: newBeginn, ende: newEnde,
              stunden: newStunden, kommentar: kommentar
            })
          });
          const result = await res.json();
          if(result.status === "success"){
            expandedPin = emp.pin;
            loadOverview();
          }else{
            alert("Fehler: " + result.message);
          }
        }catch(err){
          alert("Fehler: " + err.message);
        }finally{
          saveBtn.disabled = false;
        }
      });

      const deleteBtn = row.querySelector(".dayDeleteBtn");
      deleteBtn.addEventListener("click", async ()=>{
        if(!confirm(`Eintrag vom ${d.datum} wirklich löschen?`)) return;

        deleteBtn.disabled = true;
        try{
          const res = await fetch(EQUIP_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ token: EQUIP_API_TOKEN, action: "adminDeleteDay", pin: emp.pin, monat: month, day: d.day })
          });
          const result = await res.json();
          if(result.status === "success"){
            alert(`Eintrag gelöscht.\n\nGesamtstunden vorher: ${result.vorher} Std.\nGesamtstunden jetzt: ${result.nachher} Std.`);
            expandedPin = emp.pin;
            loadOverview();
          }else{
            alert("Fehler: " + result.message);
          }
        }catch(err){
          alert("Fehler: " + err.message);
        }finally{
          deleteBtn.disabled = false;
        }
      });

      dayList.appendChild(row);
    });
  }

  card.appendChild(body);
  if(emp.pin === expandedPin){
    body.style.display = "block";
  }
  header.addEventListener("click", ()=>{
    const willOpen = body.style.display === "none" || !body.style.display;
    body.style.display = willOpen ? "block" : "none";
    expandedPin = willOpen ? emp.pin : null;
  });

  return card;
}
</script>
</body>
</html>
